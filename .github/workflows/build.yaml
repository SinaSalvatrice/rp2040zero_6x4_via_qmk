name: Build UF2

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "config.h"
      - "info.json"
      - "readme.md"
      - "rp2040zero_6x4_via.c"
      - "rp2040zero_6x4_via.h"
      - "rules.mk"
      - "keymaps/**"
      - ".github/workflows/build.yaml"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      QMK_HOME: /home/runner/qmk_firmware

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync gcc-arm-none-eabi binutils-arm-none-eabi python3-pip git
          python3 -m pip install --upgrade pip
          pip install qmk

      - name: Build and package UF2
        run: |
          set -euo pipefail
          qmk setup -H "$QMK_HOME" -y

          mkdir -p "$QMK_HOME/keyboards/sina/rp2040zero_6x4_via"
          rsync -av ./ "$QMK_HOME/keyboards/sina/rp2040zero_6x4_via/" \
            --exclude .git \
            --exclude .github

          mkdir -p "$QMK_HOME/keyboards/rp2040_4x6_working_QMK"
          rsync -av ./ "$QMK_HOME/keyboards/rp2040_4x6_working_QMK/" \
            --exclude .git \
            --exclude .github

          cd "$QMK_HOME"
          mkdir -p "$QMK_HOME/artifacts"
          touch "$QMK_HOME/artifacts/build.start"

          BUILD_OK=0
          for TARGET in \
            "sina/rp2040zero_6x4_via:via" \
            "rp2040_4x6_working_QMK:via" \
            "rp2040_4x6_working_QMK:default"
          do
            echo "Trying build target: $TARGET"
            if make -B "$TARGET"; then
              echo "$TARGET" > "$QMK_HOME/artifacts/compiled_target.txt"
              BUILD_OK=1
              break
            fi
          done

          if [ "$BUILD_OK" -ne 1 ]; then
            echo "All build targets failed."
            exit 1
          fi

          UF2_FILE=$(find "$QMK_HOME" -type f -name "*.uf2" -newer "$QMK_HOME/artifacts/build.start" \
            -not -path "$QMK_HOME/lib/*" -not -path "$QMK_HOME/artifacts/*" | head -n 1)
          if [ -n "$UF2_FILE" ]; then
            cp -f "$UF2_FILE" "$QMK_HOME/artifacts/rp2040zero_6x4_via.uf2"
          else
            BIN_FILE=$(find "$QMK_HOME" -type f -name "*.bin" -newer "$QMK_HOME/artifacts/build.start" \
              -not -path "$QMK_HOME/lib/*" -not -path "$QMK_HOME/artifacts/*" | head -n 1)
            if [ -z "$BIN_FILE" ]; then
              echo "Could not find keyboard firmware output (.uf2 or .bin)."
              echo "Recent candidate outputs:"
              find "$QMK_HOME" -type f -newer "$QMK_HOME/artifacts/build.start" \
                \( -name "*.uf2" -o -name "*.bin" -o -name "*.elf" \) \
                -not -path "$QMK_HOME/lib/*" -not -path "$QMK_HOME/artifacts/*" | head -n 50 || true
              exit 1
            fi
            python3 "$QMK_HOME/util/uf2conv.py" \
              -b 0x10000000 \
              -f 0xe48bff56 \
              -c \
              -o "$QMK_HOME/artifacts/rp2040zero_6x4_via.uf2" \
              "$BIN_FILE"
          fi

          ls -la "$QMK_HOME/artifacts/rp2040zero_6x4_via.uf2"

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: rp2040zero_6x4_via-uf2
          path: ${{ env.QMK_HOME }}/artifacts/rp2040zero_6x4_via.uf2
          if-no-files-found: error

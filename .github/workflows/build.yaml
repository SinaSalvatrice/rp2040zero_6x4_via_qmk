name: Build QMK Firmware (rp2040zero_6x4_via_qmk)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "config.h"
      - "keyboard.json"
      - "readme.md"
      - "rp2040zero_6x4_via.c"
      - "rp2040zero_6x4_via.h"
      - "rules.mk"
      - "keymaps/**"
      - ".github/workflows/build.yaml"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install QMK CLI
        run: |
          python -m pip install --upgrade pip
          pip install qmk

      - name: Set up QMK firmware tree
        run: |
          set -euo pipefail
          qmk setup -H "$QMK_HOME" -y

          test -f "./rules.mk"
          test -f "./keymaps/via/keymap.c"

          mkdir -p "$QMK_HOME/keyboards/sina/rp2040zero_6x4_via"
          rsync -av ./ "$QMK_HOME/keyboards/sina/rp2040zero_6x4_via/" \
            --exclude .git \
            --exclude .github

          mkdir -p "$QMK_HOME/keyboards/rp2040_4x6_working_qmk"
          rsync -av ./ "$QMK_HOME/keyboards/rp2040_4x6_working_qmk/" \
            --exclude .git \
            --exclude .github
          rm -rf ~/qmk_firmware
          git clone --depth 1 https://github.com/qmk/qmk_firmware.git ~/qmk_firmware
          qmk config user.qmk_home=~/qmk_firmware

          cd "$QMK_HOME"
          mkdir -p "$QMK_HOME/artifacts"
          touch "$QMK_HOME/artifacts/build.start"

          BUILD_OK=0
          for TARGET in \
            "sina/rp2040zero_6x4_via:via" \
            "rp2040_4x6_working_qmk:via" \
            "rp2040_4x6_working_qmk:default"
            "sina/rp2040zero_6x4_via:via"
          do
            echo "Trying build target: $TARGET"
            if make -B "$TARGET"; then
              echo "$TARGET" > "$QMK_HOME/artifacts/compiled_target.txt"
              TARGET_SAFE=$(echo "$TARGET" | tr '/:' '__')
              echo "$TARGET_SAFE" > "$QMK_HOME/artifacts/compiled_target_safe.txt"
              BUILD_OK=1
              break
            fi
          done

          if [ "$BUILD_OK" -ne 1 ]; then
            echo "All build targets failed."
            exit 1
          fi

          TARGET_SAFE=$(cat "$QMK_HOME/artifacts/compiled_target_safe.txt")
      - name: Copy keyboard into QMK tree
        run: |
          mkdir -p ~/qmk_firmware/keyboards/rp2040zero_6x4_via_qmk
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            "$GITHUB_WORKSPACE/" \
            ~/qmk_firmware/keyboards/rp2040zero_6x4_via_qmk/

      - name: Install ARM GCC toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      - name: Pull submodules
        run: cd $HOME/qmk_firmware && git submodule update --init --recursive

      - name: Compile firmware
        run: |
          cd ~/qmk_firmware
          qmk compile -j 1 -kb rp2040zero_6x4_via_qmk -km via

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: rp2040zero_6x4_via_qmk_via_firmware
          path: |
            ~/qmk_firmware/*.uf2
            ~/qmk_firmware/.build/*.uf2
            ~/qmk_firmware/*.bin
            ~/qmk_firmware/.build/*.bin
          if-no-files-found: error

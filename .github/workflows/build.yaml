name: Build QMK Firmware (rp2040zero_6x4_via_qmk)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "config.h"
      - "keyboard.json"
      - "readme.md"
      - "rp2040zero_6x4_via.c"
      - "rp2040zero_6x4_via.h"
      - "rules.mk"
      - "keymaps/**"
      - ".github/workflows/build.yaml"
  pull_request:

env:
  # Last QMK revision before QMK keycodes were bumped from 0.0.8 to 0.0.9.
  # Current VIA used by this keyboard supports QMK keycode version 0x00000008.
  QMK_COMMIT: 0d401d11821a84895b59270bbb1d79e394720eb6

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install QMK CLI
        run: |
          python -m pip install --upgrade pip
          pip install qmk

      - name: Set up pinned QMK firmware tree
        run: |
          rm -rf ~/qmk_firmware
          git init ~/qmk_firmware
          cd ~/qmk_firmware
          git remote add origin https://github.com/qmk/qmk_firmware.git
          git fetch --depth 1 origin "$QMK_COMMIT"
          git checkout --detach FETCH_HEAD
          qmk config user.qmk_home=~/qmk_firmware
          grep -E 'QMK_KEYCODES_VERSION(_BCD)?' quantum/keycodes.h
          grep -q '#define QMK_KEYCODES_VERSION_BCD 0x00000008' quantum/keycodes.h

      - name: Copy keyboard into QMK tree
        run: |
          mkdir -p ~/qmk_firmware/keyboards/rp2040zero_6x4_via_qmk
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            "$GITHUB_WORKSPACE/" \
            ~/qmk_firmware/keyboards/rp2040zero_6x4_via_qmk/

      - name: Install ARM GCC toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      - name: Pull submodules
        run: cd $HOME/qmk_firmware && git submodule update --init --recursive

      - name: Compile VIA firmware
        run: |
          cd ~/qmk_firmware
          qmk compile -j 1 -kb rp2040zero_6x4_via_qmk -km via

      - name: Compile Vial firmware
        run: |
          cd ~/qmk_firmware
          qmk compile -j 1 -kb rp2040zero_6x4_via_qmk -km vial

      - name: Collect firmware artifacts
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/artifacts/via" "$GITHUB_WORKSPACE/artifacts/vial"
          VIA_UF2_FILE=$(find "$HOME/qmk_firmware" -type f -name 'rp2040zero_6x4_via_qmk_via.uf2' | head -n 1)
          VIAL_UF2_FILE=$(find "$HOME/qmk_firmware" -type f -name 'rp2040zero_6x4_via_qmk_vial.uf2' | head -n 1)
          if [ -z "$VIA_UF2_FILE" ]; then
            echo "Expected VIA firmware rp2040zero_6x4_via_qmk_via.uf2 was not produced."
            exit 1
          fi
          if [ -z "$VIAL_UF2_FILE" ]; then
            echo "Expected Vial firmware rp2040zero_6x4_via_qmk_vial.uf2 was not produced."
            exit 1
          fi
          cp "$VIA_UF2_FILE" "$GITHUB_WORKSPACE/artifacts/via/"
          cp "$GITHUB_WORKSPACE/keymaps/via/via.json" "$GITHUB_WORKSPACE/artifacts/via/via.json"
          cp "$VIAL_UF2_FILE" "$GITHUB_WORKSPACE/artifacts/vial/"
          printf 'Firmware commit: %s\nQMK commit: %s (QMK keycodes 0.0.8)\nUse the UF2 and via.json from this same artifact together.\n' "$GITHUB_SHA" "$QMK_COMMIT" > "$GITHUB_WORKSPACE/artifacts/via/README.txt"

      - name: Upload VIA firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: rp2040zero_6x4_via_qmk_via_bundle
          path: artifacts/via/
          if-no-files-found: error

      - name: Upload Vial firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: rp2040zero_6x4_via_qmk_vial_firmware
          path: artifacts/vial/
          if-no-files-found: error

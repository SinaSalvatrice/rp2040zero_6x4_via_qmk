name: Build UF2 (rp2040zero_6x4_via)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "keyboards/sina/rp2040zero_6x4_via/**"
      - ".github/workflows/build_uf2.yml"
  pull_request:

permissions:
  contents: write

env:
  # Last QMK revision before QMK keycodes were bumped from 0.0.8 to 0.0.9.
  QMK_COMMIT: 0d401d11821a84895b59270bbb1d79e394720eb6

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (your repo)
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync gcc-arm-none-eabi binutils-arm-none-eabi python3-pip git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install QMK CLI
        run: |
          python -m pip install --upgrade pip
          pip install qmk

      - name: Set up pinned QMK firmware
        run: |
          rm -rf ~/qmk_firmware
          git init ~/qmk_firmware
          cd ~/qmk_firmware
          git remote add origin https://github.com/qmk/qmk_firmware.git
          git fetch --depth 1 origin "$QMK_COMMIT"
          git checkout --detach FETCH_HEAD
          qmk config user.qmk_home=~/qmk_firmware
          grep -q '#define QMK_KEYCODES_VERSION_BCD 0x00000008' quantum/keycodes.h

      - name: Pull submodules
        run: cd $HOME/qmk_firmware && git submodule update --init --recursive

      - name: Copy keyboard into QMK tree
        run: |
          mkdir -p ~/qmk_firmware/keyboards/sina
          rsync -av keyboards/sina/rp2040zero_6x4_via ~/qmk_firmware/keyboards/sina/

      - name: Compile UF2 (via)
        working-directory: ~/qmk_firmware
        run: |
          qmk compile -kb sina/rp2040zero_6x4_via -km via

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: rp2040zero_6x4_via-uf2
          path: ~/qmk_firmware/*.uf2
          if-no-files-found: error

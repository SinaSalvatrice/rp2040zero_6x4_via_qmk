name: Build UF2 (rp2040zero_6x4_via)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "config.h"
      - "info.json"
      - "readme.md"
      - "rp2040zero_6x4_via.c"
      - "rp2040zero_6x4_via.h"
      - "rules.mk"
      - "keymaps/**"
      - ".github/workflows/build_uf2.yml"
  pull_request:

permissions:
  contents: write

env:
  QMK_HOME: /home/runner/qmk_firmware

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (your repo)
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync gcc-arm-none-eabi binutils-arm-none-eabi python3-pip git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install QMK CLI
        run: |
          python -m pip install --upgrade pip
          pip install qmk

      - name: Set up QMK firmware
        run: |
          qmk setup -H "$QMK_HOME" -y

      - name: Copy keyboard into QMK tree
        run: |
          mkdir -p "$QMK_HOME/keyboards/sina/rp2040zero_6x4_via"
          rsync -av ./ "$QMK_HOME/keyboards/sina/rp2040zero_6x4_via/" \
            --exclude .git \
            --exclude .github

      - name: Verify copied keyboard files
        run: |
          test -f "$QMK_HOME/keyboards/sina/rp2040zero_6x4_via/rules.mk"
          test -f "$QMK_HOME/keyboards/sina/rp2040zero_6x4_via/keymaps/via/keymap.c"
          ls -la "$QMK_HOME/keyboards/sina/rp2040zero_6x4_via"

      - name: Compile UF2 (via)
        run: |
          mkdir -p "$QMK_HOME/artifacts"
          touch "$QMK_HOME/artifacts/build.start"
          cd "$QMK_HOME"
          make sina/rp2040zero_6x4_via:via

      - name: Ensure UF2 exists
        run: |
          UF2_FILE=$(find "$QMK_HOME" -type f -name "*.uf2" -newer "$QMK_HOME/artifacts/build.start" | head -n 1)
          if [ -n "$UF2_FILE" ]; then
            cp -f "$UF2_FILE" "$QMK_HOME/artifacts/firmware.uf2"
            ls -la "$QMK_HOME/artifacts/firmware.uf2"
            exit 0
          fi

          BIN_FILE=$(find "$QMK_HOME" -type f -name "*.bin" -newer "$QMK_HOME/artifacts/build.start" | head -n 1)
          if [ -z "$BIN_FILE" ]; then
            echo "No newly built .bin/.uf2 file found for this run."
            exit 1
          fi

          UF2_OUT="$QMK_HOME/artifacts/firmware.uf2"
          python3 "$QMK_HOME/util/uf2conv.py" \
            -b 0x10000000 \
            -f 0xe48bff56 \
            -c \
            -o "$UF2_OUT" \
            "$BIN_FILE"
          ls -la "$UF2_OUT"

      - name: Collect UF2 artifacts
        run: |
          mkdir -p "$QMK_HOME/artifacts"
          ls -la "$QMK_HOME/artifacts"

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: rp2040zero_6x4_via-uf2
          path: ${{ env.QMK_HOME }}/artifacts/*.uf2
          if-no-files-found: error
